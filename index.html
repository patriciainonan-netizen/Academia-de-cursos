<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia de Cursos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Academia de Cursos</h1>
        <p>Registro y control de calificaciones</p>
    </header>

    <main>
        <section class="formulario">
            <h2>Registrar estudiante</h2>

            <form id="formularioEstudiante">
                <div class="grupo">
                    <label for="dni">DNI</label>
                    <input type="text" id="dni" maxlength="8" placeholder="Ingrese DNI">
                    <small id="errorDni"></small>
                </div>

                <div class="grupo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" placeholder="Ingrese nombre">
                    <small id="errorNombre"></small>
                </div>

                <div class="grupo">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" placeholder="Ingrese apellido">
                    <small id="errorApellido"></small>
                </div>

                <div class="grupo">
                    <label for="curso">Curso</label>
                    <input type="text" id="curso" placeholder="Ingrese curso">
                    <small id="errorCurso"></small>
                </div>

                <div class="notas">
                    <div class="grupo">
                        <label for="nota1">Nota 1</label>
                        <input type="number" id="nota1" min="0" max="20" step="0.01" placeholder="0 - 20">
                        <small id="errorNota1"></small>
                    </div>

                    <div class="grupo">
                        <label for="nota2">Nota 2</label>
                        <input type="number" id="nota2" min="0" max="20" step="0.01" placeholder="0 - 20">
                        <small id="errorNota2"></small>
                    </div>

                    <div class="grupo">
                        <label for="nota3">Nota 3</label>
                        <input type="number" id="nota3" min="0" max="20" step="0.01" placeholder="0 - 20">
                        <small id="errorNota3"></small>
                    </div>
                </div>

                <div class="botones">
                    <button type="submit">Registrar estudiante</button>
                    <button type="button" id="limpiar" class="btn-limpiar">Limpiar</button>
                </div>
            </form>
        </section>

        <section class="registros">
            <div class="titulo-registros">
                <h2>Estudiantes registrados</h2>
                <span id="cantidadEstudiantes">0 estudiantes</span>
            </div>

            <div id="mensajeVacio" class="mensaje-vacio">
                No hay estudiantes registrados.
            </div>

            <div class="tabla-contenedor">
                <table id="tablaEstudiantes">
                    <thead>
                        <tr>
                            <th>DNI</th>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Curso</th>
                            <th>Nota 1</th>
                            <th>Nota 2</th>
                            <th>Nota 3</th>
                            <th>Promedio</th>
                            <th>Condición</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="listaEstudiantes"></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>Academia de Cursos | Sistema de calificaciones</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
